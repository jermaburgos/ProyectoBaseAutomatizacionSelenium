name: Run Single Test
on:
  workflow_dispatch:
    inputs:
      test_name:
        description: "Nombre del metodo de test a ejecutar"
        required: true
        type: string
        default: "agregarProductosDesdeCameras"

jobs:

  run-test:
    runs-on: ubuntu-latest
    environment: qa
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_INGEST_URL }}
      TOKEN_INGEST: ${{ secrets.INGEST_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven

      - name: Verify Supabase env
        shell: bash
        run: |
          if [ -n "$SUPABASE_URL" ]; then
            echo "SUPABASE_URL configurada"
          else
            echo "SUPABASE_URL vacia"
          fi

          if [ -n "$TOKEN_INGEST" ]; then
            echo "TOKEN_INGEST configurado"
          else
            echo "TOKEN_INGEST vacio"
          fi

      - name: Resolve test target
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          TEST_NAME="${{ inputs.test_name }}"
          MATCHES=""
          COUNT=0

          while IFS= read -r FILE; do
            if grep -Fq "void ${TEST_NAME}(" "$FILE" || \
               grep -Fq "void ${TEST_NAME} (" "$FILE" || \
               grep -Fq "${TEST_NAME}(" "$FILE"; then
              MATCHES="$(printf '%s\n%s' "${MATCHES}" "$FILE")"
              COUNT=$((COUNT + 1))
            fi
          done < <(find src/test/java/test -name '*.java' -type f)

          MATCHES="$(printf '%s\n' "${MATCHES}" | sed '/^$/d')"

          if [ "${COUNT}" -eq 0 ]; then
            echo "No se encontro ningun metodo de test con el nombre: ${TEST_NAME}"
            exit 1
          fi

          if [ "${COUNT}" -gt 1 ]; then
            echo "El nombre de test es ambiguo. Coincide en mas de una clase:"
            printf '%s\n' "${MATCHES}"
            exit 1
          fi

          TEST_FILE="${MATCHES}"
          TEST_CLASS="${TEST_FILE#src/test/java/}"
          TEST_CLASS="${TEST_CLASS%.java}"
          TEST_CLASS="${TEST_CLASS//\//.}"

          echo "test_class=${TEST_CLASS}" >> "$GITHUB_OUTPUT"
          echo "test_method=${TEST_NAME}" >> "$GITHUB_OUTPUT"
          echo "Resolved target: ${TEST_CLASS}#${TEST_NAME}"

      - name: Build TestNG suite
        id: suite
        shell: bash
        run: |
          set -euo pipefail

          TEMPLATE_FILE="src/test/resources/run-single-testng.xml"
          SUITE_FILE="$RUNNER_TEMP/run-single-testng.xml"

          TEST_CLASS="${{ steps.resolve.outputs.test_class }}"
          TEST_METHOD="${{ steps.resolve.outputs.test_method }}"

          if [ ! -f "$TEMPLATE_FILE" ]; then
            echo "No se encontro la plantilla de TestNG: $TEMPLATE_FILE"
            exit 1
          fi

          TEST_CLASS_ESCAPED="${TEST_CLASS//&/\\&}"
          TEST_METHOD_ESCAPED="${TEST_METHOD//&/\\&}"

          sed \
            -e "s|test.TestPlaceholder|$TEST_CLASS_ESCAPED|g" \
            -e "s|__TEST_METHOD__|$TEST_METHOD_ESCAPED|g" \
            "$TEMPLATE_FILE" > "$SUITE_FILE"

          echo "suite_file=$SUITE_FILE" >> "$GITHUB_OUTPUT"
          echo "Suite generado en: $SUITE_FILE"
          cat "$SUITE_FILE"

      - name: Run selected test
        shell: bash
        env:
          SCREENSHOT: ${{ secrets.SCREENSHOT }}
          BROWSER: ${{ secrets.BROWSER }}
          APPROVAL_TEST: ${{ secrets.APPROVAL_THRESHOLD_TEST }}
          APIKEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          mvn test \
          -Dsurefire.suiteXmlFiles="${{ steps.suite.outputs.suite_file }}" \
          -Dscreenshots="$SCREENSHOT" \
          -Dbrowser="$BROWSER" \
          -Dheadless=true \
          -Dreport.scope=business \
          -Dworkflow.mode=single \
          -Dworkflow.identifier="${{ inputs.test_name }}" \
          -Dgithub.run_id="${{ github.run_id }}" \
          -Dapproval.threshold="$APPROVAL_TEST" \
          -Dopenai.apikey="$APIKEY" \
          -Dmaven.test.failure.ignore=true \
          -Dsupabase.ingest.url="$SUPABASE_URL" \
          -Dsupabase.ingest.token="$TOKEN_INGEST"

      - name: Reporte Smoke
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: smoke-report
          path: reports/business/
