name: Run Groups

on:
  workflow_dispatch:
    inputs:
      test_groups:
        description: "Grupos a ejecutar separados por coma. Ej: critical,smoke"
        required: true
        type: string
      browser:
        description: "Browser a usar"
        required: false
        default: chrome
        type: choice
        options:
          - chrome
          - firefox
          - edge
      headless:
        description: "Ejecutar en modo headless"
        required: false
        default: true
        type: boolean
      screenshots:
        description: "Capturar screenshots"
        required: false
        default: false
        type: boolean

jobs:
  run-groups:
    runs-on: ubuntu-latest
    environment: qa

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven

      - name: Build TestNG suite
        id: suite
        shell: bash
        run: |
          set -euo pipefail

          GROUPS_RAW="${{ inputs.test_groups }}"
          GROUPS_LIST="$(printf '%s' "$GROUPS_RAW" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | sed '/^$/d')"

          if [ -z "$GROUPS_LIST" ]; then
            echo "No se recibieron grupos validos."
            exit 1
          fi

          SUITE_FILE="$RUNNER_TEMP/testng-groups.xml"

          {
            printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>'
            printf '%s\n' '<!DOCTYPE suite SYSTEM "https://testng.org/testng-1.0.dtd">'
            printf '%s\n' '<suite name="Groups Suite">'
            printf '%s\n' '  <test name="Selected Groups">'
            printf '%s\n' '    <groups>'
            printf '%s\n' '      <run>'

            while IFS= read -r GROUP; do
              printf '        <include name="%s"/>\n' "$GROUP"
            done <<< "$GROUPS_LIST"

            printf '%s\n' '      </run>'
            printf '%s\n' '    </groups>'
            printf '%s\n' '    <packages>'
            printf '%s\n' '      <package name="test"/>'
            printf '%s\n' '    </packages>'
            printf '%s\n' '  </test>'
            printf '%s\n' '</suite>'
          } > "$SUITE_FILE"

          echo "suite_file=$SUITE_FILE" >> "$GITHUB_OUTPUT"
          echo "Suite generado en: $SUITE_FILE"
          cat "$SUITE_FILE"

      - name: Run selected groups
        shell: bash
        env:
          APPROVAL_TEST: ${{ secrets.APPROVAL_THRESHOLD_TEST }}
          APIKEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_INGEST_URL: ${{ secrets.SUPABASE_INGEST_URL }}
          SUPABASE_INGEST_TOKEN: ${{ secrets.SUPABASE_INGEST_TOKEN }}
        run: |
          mvn test \
            -Dsurefire.suiteXmlFiles="${{ steps.suite.outputs.suite_file }}" \
            -Dscreenshots=${{ inputs.screenshots }} \
            -Dbrowser=${{ inputs.browser }} \
            -Dheadless=${{ inputs.headless }} \
            -Dreport.scope=business \
            -Dapproval.threshold="$APPROVAL_TEST" \
            -Dopenai.apikey="$APIKEY" \
            -Dmaven.test.failure.ignore=true \
            -Dsupabase.ingest.url="$SUPABASE_INGEST_URL" \
            -Dsupabase.ingest.token="$SUPABASE_INGEST_TOKEN"
