name: QA Automation

on:
  push:
    branches: [main, develop]

  pull_request:
    branches: [main]

  workflow_dispatch:
    inputs:
      suite:
        description: "Suite a ejecutar"
        required: true
        default: "smoke"
        type: choice
        options:
          - smoke
          - regression
      approval_threshold:
        description: "Umbral de aprobación"
        required: true
        default: "95"
        type: string

jobs:

  unit-tests:
    name: Unit Tests

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v6

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Ejecutar Unit Tests
        run: |
          mvn clean test \
            -Dsurefire.suiteXmlFiles=src/test/resources/testng-unit.xml \
            -Dbrowser=chrome \
            -Dheadless=true \
            -Dapproval.threshold=95

      - name: Reporte Unit Tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-report
          path: |
            reports/
            target/surefire-reports/

  smoke:
    name: Smoke Tests
    needs: unit-tests
    if: github.event_name != 'workflow_dispatch' || inputs.suite == 'smoke'
    env:
      APPROVAL_THRESHOLD: ${{ github.event_name == 'workflow_dispatch' && inputs.approval_threshold || '95' }}

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v6

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Ejecutar Smoke
        run: |
          mvn clean test \
            -Dsurefire.suiteXmlFiles=src/test/resources/testng.xml \
            -Dgroups=smoke \
            -Dbrowser=chrome \
            -Dheadless=true \
            -Dapproval.threshold=${APPROVAL_THRESHOLD}

      - name: Reporte Smoke
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: |
            reports/
            target/surefire-reports/


  regression:
    name: Regression Tests
    needs: unit-tests
    if: github.event_name != 'workflow_dispatch' || inputs.suite == 'regression'
    env:
      APPROVAL_THRESHOLD: ${{ github.event_name == 'workflow_dispatch' && inputs.approval_threshold || '95' }}

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v6

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Ejecutar Regression
        run: |
          mvn clean test \
            -Dsurefire.suiteXmlFiles=src/test/resources/testng.xml \
            -Dgroups=regression \
            -Dbrowser=chrome \
            -Dheadless=true \
            -Dapproval.threshold=${APPROVAL_THRESHOLD}

      - name: Reporte Regression
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-report
          path: |
            reports/
            target/surefire-reports/
