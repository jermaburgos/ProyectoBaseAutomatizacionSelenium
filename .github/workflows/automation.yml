name: QA Automation

on:
  push:
    branches: [main, develop]

  pull_request:
    branches: [main]

  workflow_dispatch:
    inputs:
      suite:
        description: "Suite a ejecutar"
        required: true
        default: "smoke"
        type: choice
        options:
          - smoke
          - regression

jobs:

  unit-tests:
    environment: qa
    name: Unit Tests

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Ejecutar Unit Tests
        run: |
          mvn clean test \
            -Dsurefire.suiteXmlFiles=src/test/resources/testng-unit.xml \
            -Dscreenshots=${{ secrets.SCREENSHOT}} \
            -Dbrowser=${{ secrets.BROWSER}} \
            -Dheadless=true \
            -Dreport.scope=unit \
            -Dapproval.threshold=${{ secrets.APPROVAL_THRESHOLD_TESTUNIT}}

      - name: Reporte Unit Tests
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: unit-report
          path: |
            reports/unit/
            
  sonarqube:
    name: SonarQube Cloud
    needs: unit-tests
    runs-on: ubuntu-latest
    environment: qa

    steps:

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: SonarQube Analysis
        env:
          SONAR_TOKEN: ${{ secrets.TOKEN_SONAR }}
        run: |
          mvn sonar:sonar \
            -Dsonar.token=${SONAR_TOKEN}

  smoke:
    environment: qa
    name: Smoke Tests
    needs: sonarqube
    if: github.event_name != 'workflow_dispatch' || inputs.suite == 'smoke'
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Ejecutar Smoke
        run: |
          mvn clean test \
            -Dsurefire.suiteXmlFiles=src/test/resources/testng.xml \
            -Dgroups=smoke \
            -Dscreenshots=${{ secrets.SCREENSHOT}} \
            -Dbrowser=${{ secrets.BROWSER}} \
            -Dheadless=true \
            -Dreport.scope=business \
            -Dapproval.threshold=${{ secrets.APPROVAL_THRESHOLD_TEST }} \
            -Dopenai.apikey=${{ secrets.OPENAI_API_KEY }} \
            -Dmaven.test.failure.ignore=true
            
      - name: Reporte Smoke
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: smoke-report
          path: |
            reports/business/
            
      - name: Validar umbral de aprobación
        run: |
            SUMMARY=$(ls -t reports/summary/business/TestSummary*.md | head -1)
        
            echo "Validando reporte: $SUMMARY"
        
            if grep -q "Verdict: APROBADO" "$SUMMARY"; then
              echo "Pipeline aprobado según threshold"
              exit 0
            else
              echo "Pipeline no aprobado según threshold"
              exit 1
            fi

  regression:
    environment: qa
    name: Regression Tests
    needs: sonarqube
    if: github.event_name != 'workflow_dispatch' || inputs.suite == 'regression'

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Ejecutar Regression
        run: |
          mvn clean test \
            -Dsurefire.suiteXmlFiles=src/test/resources/testng.xml \
            -Dgroups=regression \
            -Dscreenshots=${{ secrets.SCREENSHOT}} \
            -Dbrowser=${{ secrets.BROWSER}} \
            -Dheadless=true \
            -Dreport.scope=business \
            -Dapproval.threshold=${{ secrets.APPROVAL_THRESHOLD_TEST }} \
            -Dopenai.apikey=${{ secrets.OPENAI_API_KEY }} \
            -Dmaven.test.failure.ignore=true

      - name: Reporte Regression
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: regression-report
          path: |
            reports/business/
            
      - name: Validar umbral de aprobación
        run: |
            SUMMARY=$(ls -t reports/summary/business/TestSummary*.md | head -1)
        
            echo "Validando reporte: $SUMMARY"
        
            if grep -q "Verdict: APROBADO" "$SUMMARY"; then
              echo "Pipeline aprobado según threshold"
              exit 0
            else
              echo "Pipeline no aprobado según threshold"
              exit 1
            fi
